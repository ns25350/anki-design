<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ankiデザイン配布</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   "Helvetica Neue", "Noto Sans JP", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 24px;
      line-height: 1.8;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    .download {
      display: block;
      margin-top: 32px;
      padding: 16px;
      text-align: center;
      text-decoration: none;
      background: #0071e3;
      color: white;
      border-radius: 12px;
      font-weight: bold;
    }

    .download:hover {
      background: #0077ed;
    }

    .note {
      margin-top: 28px;
      font-size: 14px;
      color: #6e6e73;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Ankiデザイン</h1>

    <p>
      学校新聞で紹介したAnki用デザインを
      こちらからダウンロードできます。
    </p>

    <h2>特徴</h2>

    <ul>
      <li>シンプルで見やすいデザイン</li>
      <li>スマートフォン・PCで利用可能</li>
      <li>Ankiのカードテンプレートとして利用できます</li>
    </ul>

    <a class="download"
       href="#">
      ダウンロード
    </a>

    <p class="note">
      配布版：Version 1.0
    </p>

  </div>

</body>
</html>
